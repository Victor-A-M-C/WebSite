<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor A.M.C.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            /* Enables smooth transition when teleporting down the page */
            scroll-behavior: smooth;
        }

        body, html {
            min-height: 100%;
            font-family: Arial, sans-serif;
            background-color: #DEDED2;
        }

        /* 3-Column Layout: 20% | 60% | 20% extending full page height */
        .container {
            display: grid;
            grid-template-columns: 20% 60% 20%;
            min-height: 100vh;
            width: 100vw;
        }

        /* Side Columns */
        .side {
            background-color: #A7B670;
        }

        /* Middle Column with Borders - Converted to Flexbox for pristine spacing */
        .middle {
            background-color: #DEDED2;
            border-left: 5px solid #A7B670;
            border-right: 5px solid #A7B670;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: 80px;
            position: relative; /* Allows absolute positioning for the top labels */
        }

        /* Top-left aligned label matching standard body text style */
        .top-left-label {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 16px;
            font-weight: normal;
            color: #000000;
        }

        /* Targets the 'Home' link specifically to make it black and remove underline */
        .top-left-label a {
            color: #000000;
            text-decoration: none;
        }

        /* Top-right aligned label matching standard body text style */
        .top-right-label {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 16px;
            font-weight: normal;
            color: #000000;
        }

        /* Targets the 'English' language toggle link to keep it clean, black, and non-underlined */
        .top-right-label a {
            color: #000000;
            text-decoration: none;
        }

        /* "Poems" title spacing - Updated margin-bottom to 60px (adds another extra row of spacing) */
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-top: 60px; 
            margin-bottom: 60px;
        }

        /* Grid wrapper for the columns at the top */
        .content-area {
            display: flex;
            justify-content: space-around; 
            padding: 0 20px;
            height: 560px; 
            width: 100%;
            margin-bottom: 40px;
        }

        /* Vertical column styling */
        .text-column {
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            height: 100%;
        }

        /* Individual Block Styling turned into clean clickable links */
        .block {
            font-size: 16px;
            color: #333;
            font-weight: normal;
            text-decoration: none; /* Removes default underline */
            cursor: pointer;
        }

        .block:hover {
            text-decoration: underline; /* Subtle feedback when hovering */
        }

        /* Spacing layout for the poem headers */
        .section-header {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 60px; /* Space between the prior poem block and this header */
            
            /* Forces the browser to leave 20% of the viewport height above the text when teleported to */
            scroll-margin-top: 20vh; 
        }

        /* Spacing layout for poem text - forces a precise 2-row gap (40px) under every header */
        .section-text {
            font-size: 16px;
            color: #333;
            font-weight: normal;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 40px; /* EQUIDISTANT 2-ROW GAP */
        }

        /* Bottom copyright notice centered in the middle column */
        .copyright {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: normal;
            font-style: italic;
            color: #000000;
            white-space: nowrap;
            z-index: 1000; /* Keeps it layered cleanly on top */
        }
    </style>
</head>
<body>

        <div class="side"></div>

        <div class="middle">

            <div class="top-left-label"><a href="/poems">Poems</a></div>
            <div class="top-right-label"><a href="ro/poeziiinfranceza">Română</a></div>

            <div class="title">Poems in French</div>
            
            <div class="content-area">

</body>
</html>
